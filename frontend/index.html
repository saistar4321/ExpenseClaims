<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Claims</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
        }

        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 15px;
            display: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Expense Claim</h1>

    <form id="claimForm">

        <label>Employee ID</label>
        <input id="employeeId" type="number" value="1" required>

        <label>Merchant</label>
        <input id="merchant" placeholder="TSRTC" required>

        <label>Description</label>
        <textarea id="description"
                  placeholder="Bus ticket from Hyderabad to Secunderabad"
                  required></textarea>

        <label>Amount</label>
        <input id="amount" type="number" step="0.01" required>

        <label>Expense Date</label>
        <input id="expenseDate" type="date" required>

        <label>Category</label>
        <select id="category">
            <option>Travel</option>
            <option>Food</option>
            <option>Accommodation</option>
            <option>Office Supplies</option>
            <option>Other</option>
        </select>

        <label>Receipt / Ticket Photo</label>

        <input
            id="receipt"
            type="file"
            accept="image/*"
            capture="environment"
        >

        <img id="preview">

        <button type="submit">
            Create Expense Claim
        </button>

    </form>

    <div id="result"></div>
</div>

<script>

const API = "http://127.0.0.1:8000";

const receiptInput = document.getElementById("receipt");
const preview = document.getElementById("preview");

receiptInput.addEventListener("change", () => {

    const file = receiptInput.files[0];

    if (!file) {
        preview.style.display = "none";
        return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});


document.getElementById("claimForm").addEventListener("submit", async (event) => {

    event.preventDefault();

    const result = document.getElementById("result");

    result.textContent = "Creating claim...";

    try {

        const employeeId =
            document.getElementById("employeeId").value;

        const claimData = {
            merchant: document.getElementById("merchant").value,
            description: document.getElementById("description").value,
            amount: Number(document.getElementById("amount").value),
            expense_date: document.getElementById("expenseDate").value,
            category: document.getElementById("category").value
        };

        const response = await fetch(
            `${API}/claims?employee_id=${employeeId}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(claimData)
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const claim = await response.json();

        const file = receiptInput.files[0];

        if (file) {

            result.textContent =
                `Claim #${claim.id} created. Uploading receipt...`;

            const formData = new FormData();

            formData.append("file", file);

            const uploadResponse = await fetch(
                `${API}/claims/${claim.id}/receipt`,
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!uploadResponse.ok) {
                throw new Error(await uploadResponse.text());
            }
        }

        result.textContent =
            `Claim #${claim.id} created successfully.\n\n` +
            `Status: ${claim.status}\n` +
            `Amount: ₹${claim.amount}\n` +
            `Receipt: ${file ? "Uploaded" : "Not uploaded"}\n\n` +
            `You can now submit the claim through the API.`;

    } catch (error) {

        result.textContent =
            "Error: " + error.message;
    }
});

</script>

</body>
</html>
